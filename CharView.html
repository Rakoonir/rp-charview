<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Chronik der Helden – Charakter-Editor</title>
    <link rel="stylesheet" href="./dist/styles.css" />
    <link rel="stylesheet" href="./node_modules/@fontsource/cinzel/500.css" />
    <link rel="stylesheet" href="./node_modules/@fontsource/cinzel/700.css" />
    <link
      rel="stylesheet"
      href="./node_modules/@fontsource/cinzel-decorative/700.css"
    />
    <link
      rel="stylesheet"
      href="./node_modules/@fontsource/cinzel-decorative/900.css"
    />
    <link
      rel="stylesheet"
      href="./node_modules/@fontsource/cormorant-garamond/500.css"
    />
    <link
      rel="stylesheet"
      href="./node_modules/@fontsource/cormorant-garamond/600.css"
    />
    <link
      rel="stylesheet"
      href="./node_modules/@fontsource/cormorant-garamond/500-italic.css"
    />
    <style>
      :root {
        --bg: #0d0a11;
        --bg2: #1a121d;
        --panel: #211826;
        --ink: #ecdfc4;
        --mute: #a89a82;
        --gold: #d8a64b;
        --gold2: #8c6425;
        --ember: #d5502f;
        --line: rgba(216, 166, 75, 0.35);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          --bg: #0d0a11;
        }
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        background:
          radial-gradient(
            1200px 600px at 50% -10%,
            #3a1f2c 0%,
            transparent 60%
          ),
          radial-gradient(
            800px 500px at 100% 100%,
            #1d2a2e 0%,
            transparent 60%
          ),
          var(--bg);
        color: var(--ink);
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 1.15rem;
        line-height: 1.5;
        min-height: 100vh;
      }
      h1,
      h2,
      h3,
      .cz {
        font-family: "Cinzel", "Times New Roman", serif;
        letter-spacing: 0.04em;
      }
      .logo {
        font-family: "Cinzel Decorative", "Cinzel", serif;
        font-weight: 900;
        background: linear-gradient(180deg, #fff2c4, #d8a64b 55%, #8c6425);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 2px 8px rgba(213, 80, 47, 0.45));
      }
      .panel {
        position: relative;
        background: linear-gradient(160deg, var(--panel), var(--bg2));
        border: 1px solid var(--line);
        border-radius: 4px;
        box-shadow:
          inset 0 0 0 3px var(--bg),
          inset 0 0 0 4px var(--gold2),
          0 10px 30px rgba(0, 0, 0, 0.5);
        padding: 1.4rem;
      }
      .panel::before,
      .panel::after {
        content: "❖";
        position: absolute;
        color: var(--gold);
        font-size: 0.8rem;
        line-height: 1;
        background: var(--bg);
        padding: 0 3px;
      }
      .panel::before {
        top: -6px;
        left: 14px;
      }
      .panel::after {
        bottom: -6px;
        right: 14px;
      }
      .ph {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--gold);
        font-size: 1.05rem;
        font-weight: 700;
        border-bottom: 1px solid var(--line);
        padding-bottom: 0.5rem;
        margin-bottom: 1rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-family: "Cinzel", serif;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.55rem 1rem;
        border: 1px solid var(--gold2);
        color: var(--ink);
        background: linear-gradient(180deg, #3a2a2f, #1d1419);
        border-radius: 3px;
        cursor: pointer;
        transition: 0.15s;
      }
      .btn:hover {
        border-color: var(--gold);
        box-shadow: 0 0 14px rgba(216, 166, 75, 0.4);
      }
      .btn.pri {
        background: linear-gradient(180deg, #e0b258, #9a6b24);
        color: #1a1008;
        border-color: #f3d58a;
      }
      .btn.dng:hover {
        border-color: var(--ember);
        box-shadow: 0 0 14px rgba(213, 80, 47, 0.5);
      }
      .btn:focus-visible,
      .inp:focus-visible,
      .crest:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      dialog {
        color: var(--ink);
        background: transparent;
        border: 0;
        padding: 1rem;
        width: min(100%, 46rem);
        max-width: none;
        max-height: 100%;
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(4px);
      }
      .settings-check {
        accent-color: var(--gold);
        width: 1.15rem;
        height: 1.15rem;
      }
      .inp {
        width: 100%;
        background: #120d15;
        border: 1px solid var(--gold2);
        border-radius: 3px;
        color: var(--ink);
        padding: 0.45rem 0.7rem;
        font: inherit;
      }
      .inp:focus {
        border-color: var(--gold);
        box-shadow: 0 0 10px rgba(216, 166, 75, 0.3);
      }
      label.l {
        display: block;
        font-family: "Cinzel", serif;
        font-size: 0.85rem;
        color: var(--gold);
        margin-bottom: 0.2rem;
      }
      .hex {
        width: 92px;
        height: 104px;
        clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
        background: linear-gradient(160deg, #f3d58a, #8c6425);
        display: grid;
        place-items: center;
        flex: none;
      }
      .hex > div {
        width: 84px;
        height: 96px;
        clip-path: inherit;
        background: radial-gradient(circle at 50% 30%, #4a2433, #14090f);
        display: grid;
        place-items: center;
        color: var(--gold);
      }
      .hex svg {
        width: 40px;
        height: 40px;
      }
      .card {
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .card:hover {
        transform: translateY(-3px);
      }
      .bar {
        height: 8px;
        background: #120d15;
        border: 1px solid var(--gold2);
        border-radius: 2px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
      }
      .lp {
        background: linear-gradient(90deg, #7d1f1a, #e0513a);
      }
      .mp {
        background: linear-gradient(90deg, #1f3f7d, #4fa3e8);
      }
      .stat {
        text-align: center;
        border: 1px solid var(--line);
        background: #150f18;
        padding: 0.7rem 0.4rem;
        border-radius: 3px;
      }
      .stat b {
        display: block;
        font-family: "Cinzel", serif;
        font-size: 2rem;
        color: #fff2c4;
        line-height: 1.1;
      }
      .pre {
        white-space: pre-line;
      }
      .crest {
        border: 1px solid var(--gold2);
        background: #150f18;
        color: var(--mute);
        padding: 0.5rem;
        border-radius: 3px;
        cursor: pointer;
      }
      .crest[aria-pressed="true"] {
        border-color: var(--gold);
        color: var(--gold);
        box-shadow: 0 0 12px rgba(216, 166, 75, 0.5);
      }
      .fade {
        animation: f 0.5s ease both;
      }
      @keyframes f {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fade {
          animation: none;
        }
        .card {
          transition: none;
        }
      }
      .gimg {
        aspect-ratio: 1;
        overflow: hidden;
        border: 1px solid var(--gold2);
        border-radius: 3px;
        padding: 0;
        background: #120d15;
        cursor: pointer;
      }
      .gimg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s;
      }
      .gimg:hover img {
        transform: scale(1.06);
      }
      .gimg:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .entry {
        border-left: 2px solid var(--gold2);
        padding-left: 1rem;
      }
      .side {
        padding: 0.6rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        position: sticky;
        top: 1rem;
      }
      @media (max-width: 1023px) {
        .side {
          flex-direction: row;
          overflow-x: auto;
          position: static;
        }
      }
      .sub {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.6rem 0.8rem;
        font-family: "Cinzel", serif;
        font-size: 0.92rem;
        color: var(--mute);
        border-left: 3px solid transparent;
        border-radius: 2px;
        white-space: nowrap;
        text-align: left;
        cursor: pointer;
      }
      .sub:hover {
        color: var(--ink);
        background: #150f18;
      }
      .sub.on {
        color: var(--gold);
        border-left-color: var(--gold);
        background: linear-gradient(
          90deg,
          rgba(216, 166, 75, 0.18),
          transparent
        );
      }
      .sub:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: -2px;
      }
      .tb {
        display: flex;
        flex-wrap: wrap;
        gap: 0.2rem;
        padding: 0.4rem;
        border: 1px solid var(--gold2);
        border-bottom: 0;
        background: #150f18;
        border-radius: 3px 3px 0 0;
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .tb button {
        padding: 0.35rem 0.5rem;
        border: 1px solid transparent;
        color: var(--ink);
        border-radius: 2px;
        cursor: pointer;
      }
      .tb button:hover {
        border-color: var(--gold);
        color: var(--gold);
      }
      .tb button:focus-visible {
        outline: 2px solid var(--gold);
      }
      .tb i {
        width: 1px;
        background: var(--line);
        margin: 0 0.3rem;
      }
      .rich {
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .rich[contenteditable] {
        min-height: 18rem;
        border-radius: 0 0 3px 3px;
        padding: 1rem;
      }
      .rich:empty::before {
        content: attr(data-ph);
        color: var(--mute);
      }
      .rich h2 {
        font-family: "Cinzel", serif;
        font-size: 1.6rem;
        color: var(--gold);
        margin: 1.2em 0 0.4em;
      }
      .rich h3 {
        font-family: "Cinzel", serif;
        font-size: 1.25rem;
        color: #fff2c4;
        margin: 1em 0 0.3em;
      }
      .rich p {
        margin: 0.6em 0;
      }
      .rich b,
      .rich strong {
        color: #fff2c4;
      }
      .rich ul {
        list-style: disc;
        padding-left: 1.6rem;
      }
      .rich ol {
        list-style: decimal;
        padding-left: 1.6rem;
      }
      .rich blockquote {
        border-left: 3px solid var(--gold);
        padding: 0.2rem 1rem;
        margin: 1em 0;
        font-style: italic;
        color: var(--mute);
        background: rgba(216, 166, 75, 0.06);
      }
      .rich hr {
        border: 0;
        border-top: 1px solid var(--gold2);
        margin: 1.6em auto;
        width: 60%;
      }
      .rich img {
        max-width: 100%;
        height: auto;
        margin: 1em auto;
        display: block;
        border: 1px solid var(--gold2);
        border-radius: 3px;
      }
      .read {
        font-size: 1.3rem;
        line-height: 1.85;
      }
      .read > p:first-child::first-letter {
        font-family: "Cinzel Decorative", serif;
        font-size: 3.6rem;
        float: left;
        line-height: 0.85;
        padding: 0.08em 0.12em 0 0;
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <header
      class="max-w-6xl mx-auto px-4 pt-6 flex flex-wrap items-center justify-between gap-4"
    >
      <button
        id="home"
        class="flex items-center gap-3 text-left"
        aria-label="Zur Heldenliste"
      >
        <span
          data-ic="swords"
          data-c="w-9 h-9"
          style="color: var(--gold)"
        ></span>
        <span class="logo text-3xl sm:text-4xl">Chronik der Helden</span>
      </button>
      <nav class="flex flex-wrap gap-2">
        <button class="btn" data-act="settings">
          <span aria-hidden="true">⚙</span>Einstellungen
        </button>
        <button class="btn" data-act="import">
          <span data-ic="upload" data-c="w-4 h-4"></span>Importieren
        </button>
        <button class="btn" data-act="export">
          <span data-ic="download" data-c="w-4 h-4"></span>Exportieren
        </button>
        <button class="btn pri" data-act="new">
          <span data-ic="plus" data-c="w-4 h-4"></span>Neuer Held
        </button>
      </nav>
      <input type="file" id="ifile" accept="image/*" class="hidden" /><input
        type="file"
        id="pfile"
        accept="image/*"
        class="hidden"
      /><input
        type="file"
        id="gfile"
        accept="image/*"
        multiple
        class="hidden"
      />
      <input type="file" id="file" accept="application/json" class="hidden" />
    </header>
    <main id="app" class="max-w-6xl mx-auto px-4 py-8"></main>
    <div
      id="toast"
      class="fixed left-1/2 -translate-x-1/2 bottom-6 btn pri hidden"
      role="status"
    ></div>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <section class="panel max-h-[88vh] overflow-y-auto">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h2 id="settings-title" class="text-2xl" style="color: var(--gold)">
              Einstellungen
            </h2>
            <p class="mt-1" style="color: var(--mute)">
              App-Verhalten und Updates verwalten.
            </p>
          </div>
          <button class="btn" data-act="settings-close" aria-label="Einstellungen schließen">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <div class="mt-6 space-y-5">
          <section>
            <h3 class="ph">Allgemein</h3>
            <label class="flex items-center gap-3">
              <input class="settings-check" type="checkbox" id="settings-autostart" />
              <span>Beim Anmelden an Windows automatisch starten</span>
            </label>
          </section>
          <section>
            <h3 class="ph">Updates</h3>
            <label class="flex items-center gap-3">
              <input class="settings-check" type="checkbox" id="settings-auto-check" />
              <span>Beim App-Start automatisch nach Updates suchen</span>
            </label>
            <p id="update-status" class="mt-3" role="status" aria-live="polite" style="color: var(--mute)">
              Noch nicht nach Updates gesucht.
            </p>
            <div class="flex flex-wrap gap-2 mt-3">
              <button class="btn" data-act="check-updates">Jetzt suchen</button>
              <button class="btn pri hidden" id="install-update" data-act="install-update">
                Update installieren und neu starten
              </button>
            </div>
          </section>
          <section>
            <h3 class="ph">Daten</h3>
            <p class="text-sm" style="color: var(--mute)">
              Charaktere werden nur auf diesem Computer gespeichert.
            </p>
            <button class="btn mt-3" data-act="open-data-folder">Datenordner öffnen</button>
          </section>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-3 mt-7">
          <span id="app-version" class="text-sm" style="color: var(--mute)"></span>
          <div class="flex gap-2">
            <button class="btn" data-act="settings-close">Schließen</button>
            <button class="btn pri" data-act="settings-save">Speichern</button>
          </div>
        </div>
      </section>
    </dialog>

    <script>
      /* =====================================================================
   ARCHITEKTUR (desktop-ready)
   1. core/schema   – Datenmodell, rein deklarativ (UI + Blatt werden daraus erzeugt)
   2. core/storage  – Adapter. Im Browser IndexedDB (Bilder!, localStorage als Fallback);
                      in Electron window.desktop = { load(), save(data) } per Preload-Bridge.
   3. core/store    – Zustand + CRUD, kennt keine DOM-Details
   4. ui/*          – Views (Liste, Blatt, Editor), Rendering per Template-Strings
   Beim Umzug in ein Projekt: jeden Abschnitt in eigene Datei (ES-Module) auslagern.
   ===================================================================== */

      /* ---------- 1. core/schema ---------- */
      const CRESTS = [
        "sword",
        "shield",
        "wand-2",
        "skull",
        "crown",
        "flame",
        "gem",
        "scroll-text",
      ];
      const ARTEN = [
        "Mensch",
        "Elf",
        "Zwerg",
        "Halbling",
        "Ork",
        "Gnom",
        "Tiefling",
        "Drachenblütiger",
        "Halbelf",
        "Untoter",
      ];
      const KLASSEN = [
        "Krieger",
        "Magier",
        "Schurke",
        "Kleriker",
        "Waldläufer",
        "Paladin",
        "Barde",
        "Druide",
        "Nekromant",
        "Assassine",
      ];
      const GESINNUNG = [
        "Rechtschaffen gut",
        "Neutral gut",
        "Chaotisch gut",
        "Rechtschaffen neutral",
        "Neutral",
        "Chaotisch neutral",
        "Rechtschaffen böse",
        "Neutral böse",
        "Chaotisch böse",
      ];
      const STATS = [
        ["st", "Stärke", "dumbbell"],
        ["ge", "Geschick", "wind"],
        ["ko", "Konstitution", "heart"],
        ["in", "Intelligenz", "book-open"],
        ["we", "Weisheit", "sparkles"],
        ["ch", "Charisma", "crown"],
      ];
      const SECTIONS = [
        {
          id: "id",
          title: "Identität",
          icon: "user",
          cols: 2,
          fields: [
            { k: "name", l: "Name", ph: "z. B. Aldric Sturmwacht" },
            { k: "titel", l: "Titel", ph: "z. B. Wächter des Nordpasses" },
            { k: "art", l: "Art / Volk", list: ARTEN },
            { k: "klasse", l: "Klasse / Beruf", list: KLASSEN },
            { k: "gesinnung", l: "Gesinnung", opts: GESINNUNG },
            { k: "geschlecht", l: "Geschlecht" },
            { k: "alter", l: "Alter", ph: "z. B. 34 Winter" },
            { k: "level", l: "Stufe", num: 1 },
          ],
        },
        {
          id: "er",
          title: "Erscheinung",
          icon: "eye",
          cols: 2,
          fields: [
            { k: "groesse", l: "Größe", ph: "z. B. 1,82 m" },
            { k: "gewicht", l: "Gewicht", ph: "z. B. 85 kg" },
            { k: "augen", l: "Augenfarbe" },
            { k: "haare", l: "Haarfarbe" },
            { k: "haut", l: "Hautfarbe" },
            {
              k: "besonderheiten",
              l: "Besondere Merkmale",
              area: 1,
              full: 1,
              ph: "Narben, Tätowierungen, Kleidung …",
            },
          ],
        },
        {
          id: "he",
          title: "Herkunft & Hintergrund",
          icon: "map",
          cols: 2,
          fields: [
            {
              k: "herkunft",
              l: "Herkunft / Heimat",
              ph: "z. B. Festung Eisenhall",
            },
            {
              k: "hintergrund",
              l: "Hintergrund",
              ph: "z. B. Gestrandeter Soldat",
            },
            { k: "familie", l: "Familie", area: 1, full: 1 },
          ],
        },
        {
          id: "we",
          title: "Wesen",
          icon: "heart",
          cols: 2,
          fields: [
            { k: "persoenlichkeit", l: "Persönlichkeit", area: 1 },
            { k: "ideale", l: "Ideale", area: 1 },
            { k: "bindungen", l: "Bindungen", area: 1 },
            { k: "makel", l: "Makel & Schwächen", area: 1 },
          ],
        },
        {
          id: "fa",
          title: "Fähigkeiten & Ausrüstung",
          icon: "backpack",
          cols: 2,
          fields: [
            { k: "faehigkeiten", l: "Fähigkeiten & Zauber", area: 1 },
            { k: "ausruestung", l: "Ausrüstung", area: 1 },
          ],
        },
        {
          id: "be",
          title: "Beziehungen & Ziele",
          icon: "users",
          cols: 2,
          fields: [
            { k: "verbuendete", l: "Verbündete", area: 1 },
            { k: "feinde", l: "Feinde", area: 1 },
            { k: "ziele", l: "Ziele", area: 1 },
            { k: "notizen", l: "Notizen", area: 1 },
          ],
        },
      ];
      const blank = () => ({
        id: "c" + Date.now().toString(36),
        crest: "sword",
        portrait: "",
        gallery: [],
        diary: [],
        lp: 20,
        lpMax: 20,
        mp: 10,
        mpMax: 10,
        stats: { st: 10, ge: 10, ko: 10, in: 10, we: 10, ch: 10 },
        level: 1,
        gesinnung: "Neutral",
        art: "Mensch",
        klasse: "Krieger",
      });
      const SEED = [
        {
          ...blank(),
          id: "seed1",
          name: "Aldric Sturmwacht",
          titel: "Wächter des Nordpasses",
          art: "Zwerg",
          klasse: "Paladin",
          level: 7,
          gesinnung: "Rechtschaffen gut",
          geschlecht: "Männlich",
          alter: "112 Winter",
          groesse: "1,38 m",
          gewicht: "92 kg",
          augen: "Stahlgrau",
          haare: "Kupferrot, geflochten",
          haut: "Wettergegerbt",
          besonderheiten:
            "Eine Narbe zieht sich von der linken Braue zum Kinn. Trägt stets den Wappenrock von Eisenhall.",
          herkunft: "Festung Eisenhall",
          hintergrund: "Gefallener Torwächter",
          familie:

            r.onerror = () => no(r.error);

        async load() {
          if (window.desktop?.load) return window.desktop.load();
          try {
            const db = await this._db();
            const v = await new Promise((ok, no) => {
              const q = db.transaction("kv").objectStore("kv").get(this.key);
              q.onsuccess = () => ok(q.result);
              q.onerror = () => no(q.error);
            });
            if (v) return v;
          } catch (e) {}
          try {
            return JSON.parse(localStorage.getItem(this.key));
          } catch (e) {
            return null;
          }
        },

          try {

            await new Promise((ok, no) => {

              t.objectStore("kv").put(d, this.key);
              t.oncomplete = ok;
              t.onerror = () => no(t.error);
            });

        ["removeFormat", "", "Formatierung entfernen", "remove-formatting"],
      ];
      const fmtD = (d) => {
        try {
          return new Date(d + "T12:00:00").toLocaleDateString("de-DE", {
            day: "numeric",
            month: "long",
            year: "numeric",
          });
        } catch (e) {
          return d;
        }
      };
      const shrink = (f, max, q = 0.8) =>
        new Promise((ok, no) => {
          const str = typeof f === "string",
            u = str ? f : URL.createObjectURL(f),
            i = new Image();
          i.onload = () => {
            const r = Math.min(1, max / Math.max(i.width, i.height)),
              c = document.createElement("canvas"),
              x = c.getContext("2d");
            c.width = Math.round(i.width * r);
            c.height = Math.round(i.height * r);
            x.fillStyle = "#14090f";
            x.fillRect(0, 0, c.width, c.height);
            x.drawImage(i, 0, 0, c.width, c.height);
            if (!str) URL.revokeObjectURL(u);
            ok(c.toDataURL("image/jpeg", q));
          };
          i.onerror = no;
          i.src = u;
        });
      const hexOf = (c, big) => {
        const w = big ? 130 : 92,
          h = big ? 146 : 104;
        return `<div class="hex" style="width:${w}px;height:${h}px"><div style="width:${w - 8}px;height:${h - 8}px;${c.portrait ? `background:url('${c.portrait}') center/cover` : ""}">${c.portrait ? "" : ic(c.crest || "sword", "w-10 h-10")}</div></div>`;
      };
      const toast = (m) => {
        const t = $("#toast");
        t.textContent = m;
        t.classList.remove("hidden");
        clearTimeout(t._t);
        t._t = setTimeout(() => t.classList.add("hidden"), 2200);
      };
      const updateStatus = (status) => {
        const label = $("#update-status");
        if (label) label.textContent = status.message;
        const install = $("#install-update");
        if (install) install.classList.toggle("hidden", status.event !== "downloaded");
      };
      const openSettings = async () => {
        const dialog = $("#settings-dialog");
        if (!dialog.open) dialog.showModal();
        if (!window.desktop) {
          $("#update-status").textContent = "Desktop-Einstellungen sind nur in der installierten App verfügbar.";
          return;
        }
        try {
          const settings = await window.desktop.getSettings();
          $("#settings-autostart").checked = settings.launchAtStartup;
          $("#settings-auto-check").checked = settings.autoCheckUpdates;
          $("#app-version").textContent = `Version ${settings.version} · Daten: ${settings.dataDirectory}`;
          updateStatus(settings.updateStatus);
        } catch (error) {
          console.error("Einstellungen konnten nicht geladen werden.", error);
          toast("Einstellungen konnten nicht geladen werden.");
        }
      };
      const go = (view, id = null) => {
        S.view = view;
        S.id = id;
        S.tab = "sheet";
        S.lb = null;
        S.dEdit = null;
        S.read = null;
        S.sub = "aussehen";
        S.sEdit = null;
        S.draft =
          view === "edit"
            ? structuredClone(id ? Store.get(id) : blank())

        render();
        scrollTo(0, 0);
      };

      function render(q) {
        app.innerHTML = `<div class="${q ? "" : "fade"}">${S.view === "list" ? vList() : S.view === "sheet" ? vSheet() : vEdit()}</div>${S.view === "sheet" ? vLightbox() : ""}`;
      }

      function vList() {
        const q = S.q.toLowerCase(),
          L = S.chars.filter((c) =>
            [c.name, c.art, c.klasse, c.titel]

        return `<div class="flex flex-wrap items-end justify-between gap-4 mb-8">
  <div><h1 class="text-3xl" style="color:var(--gold)">Deine Helden</h1><p style="color:var(--mute)">${S.chars.length} Charaktere in der Chronik</p></div>
  <div class="relative w-full sm:w-72"><span class="absolute left-3 top-2.5" style="color:var(--gold2)">${ic("search", "w-4 h-4")}</span>
  <input id="q" class="inp" style="padding-left:2.2rem" placeholder="Held suchen …" value="${esc(S.q)}"></div></div>
 ${
   L.length
     ? `<div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">${L.map(
         (c) => `
  <article class="panel card" tabindex="0" data-open="${c.id}">
   <div class="flex gap-4">${hexOf(c)}
   <div class="min-w-0"><h2 class="text-xl truncate" style="color:#fff2c4">${esc(c.name) || "Namenlos"}</h2>
   <p class="italic truncate" style="color:var(--mute)">${esc(c.titel)}</p>
   <p class="mt-1">${esc(c.art)} ${esc(c.klasse)}</p>
   <p class="cz text-sm" style="color:var(--gold)">Stufe ${esc(c.level)}</p></div></div>
   <div class="bar mt-4"><i class="lp" style="width:${pct(c.lp, c.lpMax)}%"></i></div></article>`,
       ).join("")}</div>`
     : `<div class="panel text-center py-12"><p class="text-xl mb-4">Keine Helden gefunden. Erschaffe den ersten Namen für die Chronik.</p><button class="btn pri" data-act="new">${ic("plus", "w-4 h-4")}Neuer Held</button></div>`
 }`;
      }
      const pct = (a, b) =>
        Math.max(0, Math.min(100, b ? Math.round((a / b) * 100) : 0));

      function vSheet() {
        const c = cur();
        if (!c) return vList();
        if (
          S.tab === "diary" &&
          S.read &&
          (c.diary || []).some((x) => x.id === S.read)
        )
          return vRead(c);
        const T = [
          ["sheet", "Charakterblatt", "scroll-text", 0],

  <button class="btn" data-act="back">${ic("arrow-left", "w-4 h-4")}Zurück</button>
  <div class="flex gap-2"><button class="btn" data-edit="${c.id}">${ic("pencil", "w-4 h-4")}Bearbeiten</button>
  <button class="btn dng" data-del="${c.id}">${ic("trash-2", "w-4 h-4")}Löschen</button></div></div>
 <section class="panel mb-6" style="background:linear-gradient(160deg,#3a1f2c,#14090f 70%)">
  <div class="flex flex-wrap items-center gap-6">${hexOf(c, true)}
  <div class="flex-1 min-w-[16rem]"><h1 class="logo text-4xl sm:text-5xl leading-tight">${esc(c.name) || "Namenlos"}</h1>
  <p class="text-xl italic" style="color:var(--mute)">${esc(c.titel)}</p>
  <p class="cz mt-2" style="color:var(--gold)">${esc(c.art)} · ${esc(c.klasse)} · Stufe ${esc(c.level)}</p></div>
  <div class="w-full sm:w-64 space-y-3">
   <div><div class="flex justify-between cz text-sm"><span>${ic("heart-pulse", "w-4 h-4 inline")} Lebenspunkte</span><span>${c.lp}/${c.lpMax}</span></div><div class="bar"><i class="lp" style="width:${pct(c.lp, c.lpMax)}%"></i></div></div>
   <div><div class="flex justify-between cz text-sm"><span>${ic("sparkles", "w-4 h-4 inline")} Mana</span><span>${c.mp}/${c.mpMax}</span></div><div class="bar"><i class="mp" style="width:${pct(c.mp, c.mpMax)}%"></i></div></div></div></div></section>
 <nav class="flex flex-wrap gap-2 mb-6" aria-label="Bereiche">${T.map(([k, l, i, n]) => `<button class="btn ${S.tab === k ? "pri" : ""}" data-tab="${k}" aria-current="${S.tab === k}">${ic(i, "w-4 h-4")}${l}${n ? ` (${n})` : ""}</button>`).join("")}</nav>
 ${S.tab === "gallery" ? tGallery(c) : S.tab === "diary" ? tDiary(c) : tSheet(c)}`;
      }

      const SUBS = [
        ["aussehen", "Aussehen", "eye", ["id", "er"]],
        ["ueber", "Über den Charakter", "users", ["he", "be"]],
        ["geschichte", "Geschichte", "scroll-text", []],
        ["faehigkeiten", "Fähigkeiten", "wand-2", ["fa"]],
        ["attribute", "Attribute", "shield", []],
        ["wesen", "Wesen", "heart", ["we"]],
      ];
      function tSheet(c) {
        const sub = SUBS.find((x) => x[0] === S.sub) || SUBS[0];
        return `<div class="grid gap-6 lg:grid-cols-[15rem_1fr] items-start">
  <nav class="side panel" aria-label="Abschnitte des Charakterblatts">${SUBS.map(([k, l, i]) => `<button class="sub ${sub[0] === k ? "on" : ""}" data-sub="${k}" aria-current="${sub[0] === k}">${ic(i)}${l}</button>`).join("")}</nav>
  <div class="space-y-6 fade">${sub[0] === "attribute" ? pAttr(c) : sub[0] === "geschichte" ? pStory(c) : pSecs(c, sub)}</div></div>`;
      }
      function pAttr(c) {
        const mod = (v) => {
          const m = Math.floor((v - 10) / 2);
          return m >= 0 ? "+" + m : m;
        };
        return `<section class="panel"><h3 class="ph">${ic("shield")}Attribute</h3>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${STATS.map(
    ([k, l, i]) => `
  <div class="stat"><span style="color:var(--gold)">${ic(i)}</span><span class="cz text-sm block">${l}</span><b>${c.stats[k]}</b><span style="color:var(--mute)">Modifikator ${mod(c.stats[k])}</span></div>`,
  ).join("")}</div></section>
 <section class="panel"><h3 class="ph">${ic("heart-pulse")}Lebenskraft</h3><div class="grid gap-4 sm:grid-cols-2">

      function pStory(c) {

        if (e)
          return `<section class="panel"><h3 class="ph">${ic("pencil")}Geschichte bearbeiten</h3>${editor(e.html, "Schreibe die Geschichte deines Helden …")}
  <div class="flex gap-2 mt-4"><button class="btn pri" data-act="ssave">${ic("save", "w-4 h-4")}Geschichte speichern</button><button class="btn" data-act="scancel">Abbrechen</button></div></section>`;
        return `<section class="panel"><div class="ph justify-between"><span class="flex items-center gap-2">${ic("scroll-text")}Geschichte</span>
  <button class="btn" data-act="sedit">${ic("pencil", "w-4 h-4")}Bearbeiten</button></div>

      function pSecs(c, sub) {
        const skip = ["name", "titel", "art", "klasse", "level"];

          .map((s) => {
            const rows = s.fields.filter((f) => c[f.k] && !skip.includes(f.k));
            if (!rows.length) return "";
            return `<section class="panel"><h3 class="ph">${ic(s.icon)}${s.title}</h3>
   <dl class="grid gap-x-8 gap-y-4 ${s.cols === 2 ? "sm:grid-cols-2" : ""}">${rows
     .map(
       (f) => `
   <div class="${f.full ? "sm:col-span-2" : ""}"><dt class="cz text-sm" style="color:var(--gold)">${f.l}</dt><dd class="pre">${esc(c[f.k])}</dd></div>`,
     )
     .join("")}</dl></section>`;
          })
          .join("");
        return (
          out ||
          `<section class="panel text-center py-10"><p style="color:var(--mute)">Zu „${sub[1]}“ ist noch nichts eingetragen.</p><button class="btn mt-4" data-edit="${c.id}">${ic("pencil", "w-4 h-4")}Jetzt ergänzen</button></section>`
        );
      }

      function tGallery(c) {
        const g = c.gallery || [];
        return `<section class="panel"><div class="ph justify-between"><span class="flex items-center gap-2">${ic("images")}Bildergalerie</span>
  <button class="btn" data-act="gadd">${ic("camera", "w-4 h-4")}Bilder hinzufügen</button></div>
  ${
    g.length
      ? `<div class="grid gap-3 grid-cols-2 sm:grid-cols-3 lg:grid-cols-4">${g.map((x, i) => `<button class="gimg" data-lb="${i}" aria-label="${esc(x.cap) || "Bild " + (i + 1)}"><img src="${x.src}" alt="${esc(x.cap)}"></button>`).join("")}</div>`
      : `<p class="py-8 text-center" style="color:var(--mute)">Noch keine Bilder. Füge Konzeptzeichnungen, Szenen oder Referenzen hinzu.</p>`
  }</section>`;
      }

      function vLightbox() {
        const g = cur()?.gallery || [],
          x = g[S.lb];
        if (S.lb === null || !x) return "";
        return `<div data-bd class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-3 p-4" style="background:rgba(8,5,10,.93)" role="dialog" aria-modal="true">
  <img src="${x.src}" alt="${esc(x.cap)}" class="max-w-full rounded" style="max-height:68vh;border:1px solid var(--gold2)">
  <input class="inp max-w-xl text-center" data-cap placeholder="Bildunterschrift …" value="${esc(x.cap)}" aria-label="Bildunterschrift">
  <div class="flex flex-wrap justify-center gap-2">
   <button class="btn" data-act="lbp" aria-label="Vorheriges Bild">${ic("chevron-left", "w-4 h-4")}</button>
   <span class="cz self-center">${S.lb + 1} / ${g.length}</span>
   <button class="btn" data-act="lbn" aria-label="Nächstes Bild">${ic("chevron-right", "w-4 h-4")}</button>
   <button class="btn" data-act="lbportrait">${ic("user", "w-4 h-4")}Als Porträt</button>
   <button class="btn dng" data-act="lbdel">${ic("trash-2", "w-4 h-4")}Löschen</button>
   <button class="btn" data-act="lbx">${ic("x", "w-4 h-4")}Schließen</button></div></div>`;
      }

      function tDiary(c) {
        const e = S.dEdit,
          L = diarySorted(c);
        const form = e
          ? `<div class="panel mb-6"><h3 class="ph">${ic("pencil")}${e.fresh ? "Neuer Eintrag" : "Eintrag bearbeiten"}</h3>
  <div class="grid gap-4 sm:grid-cols-3"><div class="sm:col-span-2"><label class="l" for="d_t">Titel</label><input class="inp" id="d_t" data-de="title" value="${esc(e.title)}" placeholder="z. B. Die Nacht im Nebelwald"></div>
  <div><label class="l" for="d_d">Datum</label><input class="inp" type="date" id="d_d" data-de="date" value="${esc(e.date)}"></div>
  <div class="sm:col-span-3"><span class="l" id="ed_l">Eintrag</span>
   ${editor(e.html, "Was ist heute geschehen? Schreibe hier deine Geschichte …")}</div></div>
  <div class="flex gap-2 mt-4"><button class="btn pri" data-act="dsave">${ic("save", "w-4 h-4")}Eintrag speichern</button><button class="btn" data-act="dcancel">Abbrechen</button></div></div>`
          : "";
        return `${form}<section class="panel"><div class="ph justify-between"><span class="flex items-center gap-2">${ic("book-open-text")}Tagebuch</span>
  <button class="btn" data-act="dnew">${ic("plus", "w-4 h-4")}Neuer Eintrag</button></div>
  ${
    L.length
      ? `<div class="space-y-7">${L.map((x) => {
          const th = (/<img[^>]+src="(data:image[^"]+)"/.exec(x.html || "") ||
              [])[1],
            pt = plain(x);
          return `<article class="entry">
   <div class="flex gap-4"><div class="flex-1 min-w-0"><div class="flex flex-wrap items-baseline justify-between gap-x-4"><h4 class="cz text-lg" style="color:#fff2c4">${esc(x.title) || "Ohne Titel"}</h4><span class="italic" style="color:var(--mute)">${fmtD(x.date)}</span></div>
   <p class="line-clamp-3 mt-1" style="color:var(--mute)">${esc(pt) || "Bild-Eintrag"}</p></div>
   ${th ? `<img src="${th}" alt="" class="w-20 h-20 object-cover rounded flex-none" style="border:1px solid var(--gold2)">` : ""}</div>

        }).join("")}</div>`
      : `<p class="py-8 text-center" style="color:var(--mute)">Das Tagebuch ist leer. Halte fest, was ${esc(c.name) || "dein Held"} erlebt.</p>`
  }</section>`;
      }

      function vRead(c) {

          newer = L[i - 1];
        const nb = (o, ico, l) =>

            ? `<button class="btn" data-rd="${o.id}" aria-label="${l}" title="${l}">${ic(ico, "w-4 h-4")}</button>`

        return `<div class="max-w-3xl mx-auto">

   <div class="flex gap-2">${nb(older, "chevron-left", "Älterer Eintrag")}${nb(newer, "chevron-right", "Neuerer Eintrag")}<button class="btn" data-dedit="${x.id}">${ic("pencil", "w-4 h-4")}Bearbeiten</button></div></div>
  <article class="panel" style="padding:2.4rem 1.6rem">
   <p class="cz text-sm" style="color:var(--mute)">${esc(c.name)} · ${fmtD(x.date)}</p>

   <div class="rich read mt-6">${entryHtml(x)}</div></article></div>`;
      }

      function field(f, c) {
        const v = esc(c[f.k]),
          id = "f_" + f.k,
          cls = f.full ? "sm:col-span-2" : "";
        let el;
        if (f.area)
          el = `<textarea class="inp" id="${id}" data-f="${f.k}" rows="${f.rows || 3}" placeholder="${f.ph || ""}">${v}</textarea>`;
        else if (f.opts)

        else
          el = `<input class="inp" id="${id}" data-f="${f.k}" ${f.num ? 'type="number" min="1" max="99" data-n="1"' : ""} ${f.list ? `list="dl_${f.k}"` : ""} value="${v}" placeholder="${f.ph || ""}">${f.list ? `<datalist id="dl_${f.k}">${f.list.map((o) => `<option value="${o}">`).join("")}</datalist>` : ""}`;
        return `<div class="${cls}"><label class="l" for="${id}">${f.l}</label>${el}</div>`;
      }

      function vEdit() {
        const c = S.draft,
          num = (k, l, sub) =>
            `<div><label class="l" for="n_${k}">${l}</label><input class="inp" type="number" min="0" max="999" id="n_${k}" data-v="${k}" value="${c[k]}"></div>`;
        return `<div class="flex flex-wrap gap-2 mb-6 justify-between">
  <h1 class="text-3xl" style="color:var(--gold)">${S.id ? "Held bearbeiten" : "Neuen Helden erschaffen"}</h1>

 <div class="grid gap-6 lg:grid-cols-2">

   <div class="flex flex-wrap items-center gap-6">${hexOf(c, true)}

    ) => `<section class="panel ${s.id === "he" ? "lg:col-span-2" : ""}"><h3 class="ph">${ic(s.icon)}${s.title}</h3>
   <div class="grid gap-4 ${s.cols === 2 ? "sm:grid-cols-2" : ""}">${s.fields.map((f) => field(f, c)).join("")}</div></section>`,
  ).join("")}
  <section class="panel"><h3 class="ph">${ic("shield")}Attribute</h3>
   <div class="grid grid-cols-2 gap-3">${STATS.map(
     ([k, l]) => `<div><label class="l" for="s_${k}">${l}</label>
   <div class="flex gap-1"><button type="button" class="btn" data-step="${k}" data-d="-1" aria-label="${l} senken">−</button>
   <input class="inp text-center" type="number" min="1" max="30" id="s_${k}" data-s="${k}" value="${c.stats[k]}">
   <button type="button" class="btn" data-step="${k}" data-d="1" aria-label="${l} erhöhen">+</button></div></div>`,
   ).join("")}</div></section>
  <section class="panel"><h3 class="ph">${ic("heart-pulse")}Lebenskraft</h3>
   <div class="grid grid-cols-2 gap-4">${num("lp", "Lebenspunkte")}${num("lpMax", "Max. Lebenspunkte")}${num("mp", "Mana")}${num("mpMax", "Max. Mana")}</div></section>
 </div>`;
      }

      /* ---------- Events (delegiert) ---------- */
      document.addEventListener("click", async (e) => {
        const t = e.target.closest("button,[data-open],[data-bd]");
        if (!t) return;
        const d = t.dataset;
        if (t.id === "home" || d.act === "back") {
          go("list");
        } else if (d.open) go("sheet", d.open);
        else if (d.tab) {
          if (E() && !confirm("Ungespeicherte Änderungen verwerfen?")) return;
          S.tab = d.tab;
          S.lb = null;
          S.dEdit = null;
          S.sEdit = null;
          S.read = null;
          render(true);
        } else if (d.sub) {
          if (
            S.sEdit &&
            !confirm("Ungespeicherte Änderungen an der Geschichte verwerfen?")
          )
            return;
          S.sEdit = null;
          S.sub = d.sub;
          render(true);
        } else if (d.act === "sedit") {
          S.sEdit = { html: storyHtml(cur()) };
          render(true);
        } else if (d.act === "scancel") {
          S.sEdit = null;
          render(true);
        } else if (d.act === "ssave") {
          const ed = $("#ed"),
            c = cur();
          c.geschichteHtml = clean(ed.innerHTML);
          c.geschichte = ed.innerText.trim();
          await Store.save(c);
          S.sEdit = null;
          toast("Geschichte gespeichert");
          render(true);
        } else if (d.rd) {
          S.read = d.rd;
          S.dEdit = null;
          render(true);
          scrollTo(0, 0);
        } else if (d.act === "rdx") {
          S.read = null;
          render(true);
        } else if (d.cmd) {
          if (d.cmd === "img") {
            $("#ifile").click();
            return;
          }
          const ed = $("#ed");
          if (!ed) return;
          ed.focus();
          if (d.cmd === "block") {
            const v = (
              document.queryCommandValue("formatBlock") || ""
            ).toLowerCase();
            document.execCommand(
              "formatBlock",
              false,
              "<" + (v === d.val ? "p" : d.val) + ">",
            );
          } else document.execCommand(d.cmd, false, null);
          E().html = ed.innerHTML;
        } else if (d.lb !== undefined) {
          S.lb = +d.lb;
          render(true);
        } else if (d.bd !== undefined) {
          if (e.target === t) {
            S.lb = null;
            render(true);
          }
        } else if (d.act === "lbx") {
          S.lb = null;
          render(true);
        } else if (d.act === "lbp" || d.act === "lbn") {
          const n = cur().gallery.length;
          S.lb = (S.lb + (d.act === "lbn" ? 1 : -1) + n) % n;
          render(true);
        } else if (d.act === "lbportrait") {
          const c = cur();
          c.portrait = c.gallery[S.lb].src;
          S.lb = null;
          await Store.save(c);
          toast("Porträt gesetzt");
          render(true);
        } else if (d.act === "lbdel") {
          if (confirm("Dieses Bild entfernen?")) {
            const c = cur();
            c.gallery.splice(S.lb, 1);
            S.lb = null;
            await Store.save(c);
            render(true);
          }
        } else if (d.act === "gadd") $("#gfile").click();
        else if (d.act === "portrait") $("#pfile").click();
        else if (d.act === "portraitdel") {
          S.draft.portrait = "";
          render(true);
        } else if (d.act === "dnew") {
          S.dEdit = {
            fresh: 1,
            id: "d" + Date.now().toString(36),
            date: new Date().toISOString().slice(0, 10),
            title: "",
            text: "",
            html: "",
          };
          S.read = null;
          render(true);
        } else if (d.dedit) {
          const x = cur().diary.find((y) => y.id === d.dedit);
          S.dEdit = { ...x, html: entryHtml(x) };
          S.read = null;
          S.tab = "diary";
          render(true);
          scrollTo(0, 0);
        } else if (d.act === "dcancel") {
          S.dEdit = null;
          render(true);
        } else if (d.act === "dsave") {
          const e2 = S.dEdit,
            c = cur(),
            ed = $("#ed");
          e2.html = clean(ed.innerHTML);
          e2.text = ed.innerText.trim();
          if (!(e2.title || "").trim() && !e2.text && !/<img/.test(e2.html)) {
            toast("Ein Eintrag braucht Titel oder Text.");
            return;
          }
          delete e2.fresh;
          c.diary = c.diary || [];
          const i = c.diary.findIndex((x) => x.id === e2.id);
          i < 0 ? c.diary.push(e2) : (c.diary[i] = e2);
          await Store.save(c);
          S.dEdit = null;
          toast("Eintrag gespeichert");
          render(true);
        } else if (d.ddel) {
          if (confirm("Diesen Tagebucheintrag löschen?")) {
            const c = cur();
            c.diary = c.diary.filter((x) => x.id !== d.ddel);
            await Store.save(c);
            render(true);
          }
        } else if (d.act === "new") go("edit");
        else if (d.edit) go("edit", d.edit);
        else if (d.act === "cancel") S.id ? go("sheet", S.id) : go("list");
        else if (d.del) {
          if (confirm("Diesen Helden endgültig aus der Chronik tilgen?")) {
            await Store.remove(d.del);
            toast("Held getilgt");
            go("list");
          }
        } else if (d.crest) {
          S.draft.crest = d.crest;
          document
            .querySelectorAll("[data-crest]")
            .forEach((b) =>
              b.setAttribute("aria-pressed", b.dataset.crest === d.crest),
            );
        } else if (d.step) {
          const i = $(`#s_${d.step}`),
            v = Math.max(1, Math.min(30, +i.value + +d.d));
          i.value = v;
          S.draft.stats[d.step] = v;
        } else if (d.act === "save") {
          if (!(S.draft.name || "").trim()) {
            toast("Ein Held braucht einen Namen.");
            $("#f_name").focus();
            return;
          }
          await Store.save(S.draft);
          toast("In die Chronik eingetragen");
          go("sheet", S.draft.id);
        } else if (d.act === "export") {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(
            new Blob([JSON.stringify(S.chars, null, 2)], {
              type: "application/json",
            }),
          );
          a.download = "chronik-der-helden.json";
          a.click();
          toast("Chronik exportiert");
        } else if (d.act === "import") $("#file").click();
        else if (d.act === "settings") await openSettings();
        else if (d.act === "settings-close") $("#settings-dialog").close();
        else if (d.act === "settings-save") {
          if (!window.desktop) {
            toast("Einstellungen sind nur in der installierten App verfügbar.");
            return;
          }
          try {
            await window.desktop.saveSettings({
              autoCheckUpdates: $("#settings-auto-check").checked,
              launchAtStartup: $("#settings-autostart").checked,
            });
            toast("Einstellungen gespeichert");
            $("#settings-dialog").close();
          } catch (error) {
            console.error("Einstellungen konnten nicht gespeichert werden.", error);
            toast("Einstellungen konnten nicht gespeichert werden.");
          }
        } else if (d.act === "check-updates") {
          if (window.desktop) await window.desktop.checkForUpdates();
          else updateStatus({ event: "unavailable", message: "Nur in der installierten App verfügbar." });
        } else if (d.act === "install-update") {
          if (window.desktop) await window.desktop.installUpdate();
        } else if (d.act === "open-data-folder") {
          if (window.desktop) {
            try {
              await window.desktop.openDataFolder();
            } catch (error) {
              console.error("Datenordner konnte nicht geöffnet werden.", error);
              toast("Datenordner konnte nicht geöffnet werden.");
            }
          }
        }
      });
      window.desktop?.onOpenSettings(() => openSettings());
      window.desktop?.onUpdateStatus(updateStatus);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.dataset.open)
          go("sheet", e.target.dataset.open);
        if (S.lb !== null && S.view === "sheet") {
          if (e.key === "Escape") {
            S.lb = null;
            render(true);
          } else if (
            e.target.tagName !== "INPUT" &&
            (e.key === "ArrowLeft" || e.key === "ArrowRight")
          )
            $(`[data-act="${e.key === "ArrowRight" ? "lbn" : "lbp"}"]`).click();
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.dataset.cap !== undefined) Store.persist();
      });
      document.addEventListener("input", (e) => {
        const t = e.target,
          d = t.dataset;
        if (t.id === "q") {
          S.q = t.value;
          const p = t.selectionStart;
          render();
          const q = $("#q");
          q.focus();
          q.setSelectionRange(p, p);
        } else if (d.f) S.draft[d.f] = d.n ? +t.value : t.value;
        else if (d.v) S.draft[d.v] = +t.value;
        else if (d.s)
          S.draft.stats[d.s] = Math.max(1, Math.min(30, +t.value || 1));
        else if (t.id === "ed") E().html = t.innerHTML;
        else if (d.de !== undefined) S.dEdit[d.de] = t.value;
        else if (d.cap !== undefined) cur().gallery[S.lb].cap = t.value;
      });
      $("#file").addEventListener("change", async (e) => {
        try {
          const arr = JSON.parse(await e.target.files[0].text());
          if (!Array.isArray(arr)) throw 0;
          arr.forEach((c) => {
            if (c && c.id && c.name) {
              const i = S.chars.findIndex((x) => x.id === c.id);
              i < 0 ? S.chars.push(c) : (S.chars[i] = c);
            }
          });
          await Store.persist();
          toast("Chronik importiert");
          go("list");
        } catch (err) {
          toast("Datei ist keine gültige Chronik.");
        }
        e.target.value = "";
      });

      let rng = null;
      document.addEventListener("selectionchange", () => {
        const ed = $("#ed"),
          sl = getSelection();
        if (ed && sl.rangeCount && ed.contains(sl.anchorNode))
          rng = sl.getRangeAt(0).cloneRange();
      });
      document.addEventListener("mousedown", (e) => {
        if (e.target.closest(".tb")) e.preventDefault();
      });
      document.addEventListener("paste", (e) => {
        if (e.target.id === "ed") {
          e.preventDefault();
          document.execCommand(
            "insertText",
            false,
            e.clipboardData.getData("text/plain"),
          );
          E().html = e.target.innerHTML;
        }
      });
      $("#ifile").addEventListener("change", async (e) => {
        const f = e.target.files[0];
        e.target.value = "";
        const ed = $("#ed");
        if (!f || !ed) return;
        try {
          const src = await shrink(f, 900, 0.8);
          ed.focus();
          const sl = getSelection();
          if (rng) {
            sl.removeAllRanges();
            sl.addRange(rng);
          }
          document.execCommand("insertImage", false, src);
          E().html = ed.innerHTML;
        } catch (x) {
          toast("Bild konnte nicht gelesen werden.");
        }
      });
      $("#pfile").addEventListener("change", async (e) => {
        const f = e.target.files[0];
        e.target.value = "";
        if (!f) return;
        try {
          S.draft.portrait = await shrink(f, 600, 0.85);
          render(true);
        } catch (x) {
          toast("Bild konnte nicht gelesen werden.");
        }
      });
      $("#gfile").addEventListener("change", async (e) => {
        const fs = [...e.target.files];
        e.target.value = "";
        const c = cur();
        if (!c) return;
        try {
          for (const f of fs)
            (c.gallery = c.gallery || []).push({
              id:
                "g" +
                Date.now().toString(36) +
                Math.random().toString(36).slice(2, 5),
              src: await shrink(f, 1200, 0.8),
              cap: "",
            });
          await Store.save(c);
          toast(fs.length + " Bild(er) hinzugefügt");
          render(true);
        } catch (x) {
          toast("Bild konnte nicht gelesen werden.");
        }
      });

      document.querySelectorAll("[data-ic]").forEach((el) => {
        const st = el.getAttribute("style") || "";
        el.outerHTML = ic(el.dataset.ic, el.dataset.c).replace(
          "<svg",
          `<svg style="${st}"`,
        );
      });
      document.execCommand("defaultParagraphSeparator", false, "p");
      Store.init()
        .then(() => render())
        .catch((error) => {
          console.error("Chronik konnte nicht geladen werden.", error);
          toast("Chronik konnte nicht geladen werden. Es werden Beispieldaten angezeigt.");
          S.chars = SEED;
          render();
        });
    </script>
  </body>
</html>
